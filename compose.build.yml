services:
  nanobot:
    # Local builds get their own tag so they never shadow the published
    # nipakke/nanobot image that compose.yml runs by default.
    image: ${NANOBOT_BUILD_IMAGE:-nanobot-pixi:local}
    build:
      context: .
      args:
        # Version pins live only in the Dockerfile. These are passed through
        # only when set in the environment or .env; otherwise the Dockerfile
        # defaults apply.
        - NANOBOT_VERSION
        - PIXI_VERSION
        - BREW_VERSION
        - BREW_COMMIT
        - BUNDLE_TUI=${BUNDLE_TUI:-0}
        - UID=${UID:-1000}
        - GID=${GID:-1000}
