name: publish

# Builds, verifies, and publishes docker.io/nipakke/nanobot.
#
# Runs ONLY on pushes to `main` that touch image files, or on a manual
# `workflow_dispatch` run. Never runs on pull requests.
#
# Currently in DRY-RUN mode: the Docker Hub login and push steps at the bottom
# are commented out until the Docker Hub repo and secrets are set up.

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - .dockerignore
      - scripts/**
      - '!scripts/smoke-test.sh'
      - '!scripts/smoke-compose.yml'
      - etc/**
  workflow_dispatch:
    inputs:
      publish:
        description: Push the tested image to Docker Hub (ignored while push steps are commented out)
        type: boolean
        default: false

env:
  IMAGE_NAME: docker.io/nipakke/nanobot
  TEST_IMAGE: nanobot-pixi:ci

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Compute tags and labels
        id: meta
        run: |
          set -euo pipefail
          version="$(sed -n 's/^ARG NANOBOT_VERSION=//p' Dockerfile | head -n 1 | tr -d '\r')"
          [ -n "$version" ] || { echo "NANOBOT_VERSION default not found in Dockerfile" >&2; exit 1; }
          stamp="$(date -u +%Y%m%d)"
          short="$(git rev-parse --short=7 HEAD)"
          should_push=false
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.publish }}" = "true" ]; then
            should_push=true
          fi
          {
            echo "version=$version"
            echo "fixed=${IMAGE_NAME}:${version}-${stamp}-${short}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "should_push=$should_push"
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:latest"
            echo "${IMAGE_NAME}:${version}"
            echo "${IMAGE_NAME}:${version}-${stamp}-${short}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Free runner disk space
        if: ${{ !env.ACT }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.TEST_IMAGE }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
          # act has no GitHub Actions cache backend for BuildKit; the cache is
          # an optimisation only.
          cache-from: ${{ !env.ACT && 'type=gha' || '' }}
          cache-to: ${{ !env.ACT && 'type=gha,mode=max' || '' }}

      - name: Run smoke tests
        env:
          NANOBOT_SMOKE_IMAGE: ${{ env.TEST_IMAGE }}
          NANOBOT_SMOKE_SKIP_BUILD: "1"
        run: bash scripts/smoke-test.sh

      - name: Tag the tested image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker tag "$TEST_IMAGE" "$tag"
          done <<< "$TAGS"
          docker image ls "$IMAGE_NAME"

      - name: Dry-run summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Dry run (publishing is commented out)"
            echo "should_push=${{ steps.meta.outputs.should_push }}"
            echo "Tested image tagged locally as:"
            echo '```'
            echo "$TAGS"
            echo '```'
          } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"

      # Uncomment the two steps below once the Docker Hub repo `nipakke/nanobot`
      # and the DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets are configured.
      #
      # - name: Log in to Docker Hub
      #   if: steps.meta.outputs.should_push == 'true'
      #   uses: docker/login-action@v4
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}
      #
      # - name: Push the tested image
      #   if: steps.meta.outputs.should_push == 'true'
      #   run: |
      #     set -euo pipefail
      #     # Fixed tag first, moving tags last, so `latest` never points at a
      #     # digest whose fixed tag failed to upload.
      #     docker push "${{ steps.meta.outputs.fixed }}"
      #     docker push "${IMAGE_NAME}:${{ steps.meta.outputs.version }}"
      #     docker push "${IMAGE_NAME}:latest"
      #     echo "Published ${{ steps.meta.outputs.fixed }}" >> "$GITHUB_STEP_SUMMARY"
