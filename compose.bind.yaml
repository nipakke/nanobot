# Host-directory persistence overlay.
#
#   docker compose -f compose.yaml -f compose.bind.yaml up -d
#
# Replaces four of the five named volumes with bind mounts under ./data, so
# config, sessions and tools live in a plain folder you can back up by copying
# it. ./data is gitignored.
#
# /data/brew is deliberately NOT overridden: it stays the nanobot_brew named
# volume in both modes. Homebrew rewrites its own git checkout (auto-update) and
# unpacks large bottles; on Windows a ./data bind is a 9p/drvfs share, where that
# kind of write churn is slow and has already destabilised the Docker engine.
# Keeping the brew tree on a real ext4 volume is what makes a WebUI
# `brew install` safe. Overriding this path is not supported.
services:
  nanobot:
    volumes:
      - ./data/config:/data/config
      - ./data/home:/data/home
      - ./data/pixi:/data/pixi
      - ./data/cache:/data/cache
