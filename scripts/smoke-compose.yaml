# Test-only Compose override for scripts/smoke-test.sh.
#
# compose.yaml pins `container_name: nanobot` because operators rely on that
# name for `docker compose exec`/`docker exec`. The acceptance suite must not
# take it over: it would rename the operator's container out of the way, and
# the suite's `down -v --remove-orphans` would then delete it. The suite
# exports a per-run name and passes this file last, so only its own container
# is affected. Host ports are kept distinct the same way: the suite exports
# NANOBOT_HEALTH_HOST_PORT and NANOBOT_WEB_PORT before it composes the stack.
services:
  nanobot:
    container_name: ${NANOBOT_SMOKE_CONTAINER:?scripts/smoke-test.sh must export NANOBOT_SMOKE_CONTAINER}
